[alembic]
script_location = migrations
# The database URL is read from MIGRATION_DATABASE_URL in migrations/env.py.
# Never put credentials in this file.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
