[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportpilot-api"
version = "0.1.0"
description = "SupportPilot API: multi-tenant, citation-grounded AI support platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import order
  "B",        # bugbear
  "UP",       # pyupgrade
  "S",        # bandit security checks
  "SIM",      # simplifications
  "C4",       # comprehensions
  "PT",       # pytest style
  "RUF",
  "ASYNC",
]

[tool.ruff.lint.per-file-ignores]
# Asserts and throwaway credentials are expected in tests.
"tests/**" = ["S101", "S105", "S106", "S603", "S608"]
# Migrations are hand-written SQL by design (see the add-migration skill).
"migrations/**" = ["S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true
